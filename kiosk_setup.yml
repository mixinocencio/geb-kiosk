---
- name: "Setup Kiosk Blindagem Total - Operação EBEG (Versão Final Consolidada)"
  hosts: all
  become: yes

  tasks:
    - name: "1. Instalar infraestrutura de base e utilitários"
      ansible.builtin.apt:
        name: [openbox, lightdm, xbindkeys, xdotool, dbus-x11, lxterminal, wget]
        state: present
        update_cache: yes

    - name: "2. Verificar se o Google Chrome já está instalado (Idempotência)"
      ansible.builtin.command: dpkg -s google-chrome-stable
      register: chrome_check
      ignore_errors: yes
      changed_when: false

    - name: "3. Instalação do Google Chrome (Apenas se ausente)"
      block:
        - name: "Baixar pacote .deb do Chrome"
          ansible.builtin.get_url:
            url: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            dest: /tmp/google-chrome-stable_current_amd64.deb
            mode: '0644'

        - name: "Instalar Chrome via APT"
          ansible.builtin.apt:
            deb: /tmp/google-chrome-stable_current_amd64.deb
            state: present

        - name: "Remover instalador temporário"
          ansible.builtin.file:
            path: /tmp/google-chrome-stable_current_amd64.deb
            state: absent
      when: chrome_check.rc != 0

    - name: "4. Garantir existência dos diretórios de política do Chrome"
      ansible.builtin.file:
        path: /etc/opt/chrome/policies/managed
        state: directory
        mode: '0755'
        recurse: yes

    - name: "5. Aplicar Política Enterprise (Sem Bloqueio de URL - Gestão via Firewall)"
      ansible.builtin.copy:
        dest: /etc/opt/chrome/policies/managed/policy.json
        content: |
          {
            "PasswordManagerEnabled": false,
            "DeveloperToolsDisabled": true,
            "ContextMenuEnabled": false,
            "ShowHomeButton": false,
            "BookmarkBarEnabled": false,
            "EditBookmarksEnabled": false,
            "AllowFileSelectionDialogs": false,
            "TranslateEnabled": false,
            "FullscreenAllowed": true
          }

    - name: "6. Configurar permissões de Sudo (Acesso de Administrador)"
      ansible.builtin.copy:
        dest: /etc/sudoers.d/kiosk-admin
        content: |
          administrador ALL=(ALL) NOPASSWD: /sbin/poweroff, /usr/sbin/poweroff, /bin/chvt, /usr/bin/chvt, /bin/systemctl
        mode: '0440'

    - name: "7. Configurar Autologin e Sessão LightDM"
      ansible.builtin.copy:
        dest: /etc/lightdm/lightdm.conf.d/99-kiosk-autologin.conf
        content: "[Seat:*]\nautologin-user=administrador\nautologin-session=kiosk"

    - name: "8. Criar estrutura de configuração do Openbox"
      ansible.builtin.file:
        path: "/home/administrador/.config/openbox"
        state: directory
        owner: administrador
        group: administrador
        mode: '0755'

    - name: "9. Configurar Regras de Janela e Atalho 'Home' no Openbox"
      ansible.builtin.copy:
        dest: "/home/administrador/.config/openbox/rc.xml"
        owner: administrador
        group: administrador
        content: |
          <?xml version="1.0" encoding="UTF-8"?>
          <openbox_config xmlns="http://openbox.org/3.4/rc">
            <applications>
              <application name="app-*">
                <decor>no</decor>
                <fullscreen>yes</fullscreen>
              </application>
              <application name="google-chrome">
                <decor>yes</decor>
                <position force="yes"><x>center</x><y>center</y></position>
                <size><width>95%</width><height>95%</height></size>
              </application>
            </applications>
            <keyboard>
              <keybind key="Home"><action name="Execute"><command>pkill -9 chrome && pkill -9 openbox</command></action></keybind>
              <keybind key="A-F4"><action name="Close"/></keybind>
              <keybind key="C-A-Insert"><action name="Execute"><command>sudo /usr/bin/chvt 4</command></action></keybind>
            </keyboard>
          </openbox_config>

    - name: "10. Bloqueio de Teclado e Atalhos (xbindkeys)"
      ansible.builtin.copy:
        dest: /home/administrador/.xbindkeysrc
        owner: administrador
        group: administrador
        content: |
          # Reinício rápido do Kiosk
          "pkill -9 chrome && pkill -9 openbox"
            Home
          # Bloqueio de atalhos de navegação e foco
          "true"
            Control + l
          "true"
            Alt + d
          "true"
            Control + t
          "true"
            Control + n
          "true"
            F11
          "true"
            F12
          # Comandos de Sistema
          "sudo /sbin/poweroff"
            End
          "sudo /usr/bin/chvt 4"
            Control + Alt + Insert

    - name: "11. Script de Inicialização e Manutenção de Cache (kiosk.sh)"
      ansible.builtin.copy:
        dest: /home/administrador/kiosk.sh
        owner: administrador
        group: administrador
        mode: '0755'
        content: |
          #!/bin/bash
          openbox --config-file /home/administrador/.config/openbox/rc.xml &
          xbindkeys &
          xset s off -dpms
          while true; do
              # Limpa cache para garantir privacidade em cada reinício
              rm -rf /home/administrador/.config/google-chrome
              google-chrome --app="{{ url_kiosk }}" --incognito --no-first-run --password-store=basic
              sleep 2
          done

    - name: "12. Criar Ficheiro de Sessão Desktop"
      ansible.builtin.copy:
        dest: /usr/share/xsessions/kiosk.desktop
        content: |
          [Desktop Entry]
          Name=Kiosk Mode
          Exec=/home/administrador/kiosk.sh
          Type=Application

    - name: "13. Garantir Permissões e Aplicar Reboot"
      ansible.builtin.shell: chown -R administrador:administrador /home/administrador/
      notify: "Reiniciar Sistema"

  handlers:
    - name: "Reiniciar Sistema"
      ansible.builtin.reboot: