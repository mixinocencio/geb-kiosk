---
- name: Setup de Kiosk Blindado (Nível Industrial)
  hosts: quiosques
  become: yes

  tasks:
    - name: 1. Instalar infraestrutura mínima (Openbox e ferramentas)
      ansible.builtin.apt:
        name:
          - openbox
          - xdotool
          - python3-dbus
        state: present
        update_cache: yes

    - name: 2. Criar script de loop de execução (Anti-fechamento)
      ansible.builtin.copy:
        dest: /usr/local/bin/kiosk.sh
        mode: '0755'
        content: |
          #!/bin/bash
          # Desabilita proteção de tela e gerenciamento de energia
          xset s off
          xset s noblank
          xset -dpms

          # Loop infinito: se o navegador fechar, ele reabre instantaneamente
          while true; do
            google-chrome --kiosk --no-first-run --noerrdialogs --disable-infobars --disable-session-crashed-bubble --check-for-update-interval=31536000 "{{ url_kiosk }}"
            sleep 2
          done

    - name: 3. Criar definição de sessão customizada para o LightDM
      ansible.builtin.copy:
        dest: /usr/share/xsessions/kiosk.desktop
        content: |
          [Desktop Entry]
          Name=Kiosk
          Comment=Sessão de Navegador Exclusiva
          Exec=openbox --startup /usr/local/bin/kiosk.sh
          Type=Application

    - name: 4. Resetar Chaveiro de Senhas (Remove pedido de senha do Chrome)
      ansible.builtin.shell: |
        rm -rf /home/administrador/.local/share/keyrings/*
        # Cria um chaveiro padrão sem senha
        python3 -c "import dbus; bus = dbus.SessionBus(); remote_object = bus.get_object('org.freedesktop.secrets', '/org/freedesktop/secrets'); interface = dbus.Interface(remote_object, 'org.freedesktop.Secret.Service'); interface.CreateCollection({'org.freedesktop.Secret.Collection.Label': 'Default'}, '')" || true
      become_user: administrador
      ignore_errors: yes

    - name: 5. Configurar Autologin para a nova sessão de Kiosk
      ansible.builtin.copy:
        dest: /etc/lightdm/lightdm.conf
        content: |
          [Seat:*]
          autologin-guest=false
          autologin-user=administrador
          autologin-user-timeout=0
          user-session=kiosk
        mode: '0644'

    - name: 6. Blindar Teclado (Desabilitar TTYs e Atalhos de Sistema)
      ansible.builtin.copy:
        dest: /etc/X11/xorg.conf.d/99-disable-keys.conf
        content: |
          Section "ServerFlags"
              Option "DontVTSwitch" "true"
              Option "DontZap" "true"
          EndSection

          Section "InputClass"
              Identifier "Keyboard Catchall"
              MatchIsKeyboard "on"
              Option "XkbOptions" "terminate:ctrl_alt_bksp, grab:break_actions"
          EndSection

    - name: 7. Desabilitar Menu de Contexto do Openbox (Botão Direito)
      ansible.builtin.file:
        path: /home/administrador/.config/openbox
        state: directory
        owner: administrador
        mode: '0755'

    - name: 8. Configurar Openbox para ignorar atalhos (Alt+F4, Alt+Tab, etc)
      ansible.builtin.copy:
        dest: /home/administrador/.config/openbox/rc.xml
        owner: administrador
        content: |
          <?xml version="1.0" encoding="UTF-8"?>
          <openbox_config xmlns="http://openbox.org/3.4/rc">
            <keyboard>
              <chainQuitKey>C-g</chainQuitKey>
              <keybind key="A-F4"><action name="Execute"><command>true</command></action></keybind>
              <keybind key="A-Tab"><action name="Execute"><command>true</command></action></keybind>
              <keybind key="A-F2"><action name="Execute"><command>true</command></action></keybind>
            </keyboard>
            <mouse>
              <context name="Root">
                <mousebind action="Press" button="Right"><action name="Execute"><command>true</command></action></mousebind>
              </context>
            </mouse>
          </openbox_config>

    - name: 9. Reiniciar Sistema para aplicar blindagem
      ansible.builtin.reboot: