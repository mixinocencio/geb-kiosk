---
- name: "Setup Kiosk Blindado - Operação Loop Infinito"
  hosts: quiosques
  become: yes

  tasks:
    - name: "1. Instalar pacotes de controle de interface"
      ansible.builtin.apt:
        name:
          - openbox
          - xdotool
          - dbus-x11
          - x11-xserver-utils
        state: present
        update_cache: yes

    - name: "2. Limpeza de sessões e chaveiros antigos"
      ansible.builtin.shell: |
        chmod -x /usr/bin/gnome-keyring-daemon || true
        rm -rf /home/administrador/.local/share/keyrings/*
        rm -rf /etc/lightdm/lightdm.conf.d/*
      ignore_errors: yes

    - name: "3. Criar o Script Mestre de Execução (O Coração do Kiosk)"
      ansible.builtin.copy:
        dest: "/usr/local/bin/kiosk.sh"
        mode: '0755'
        owner: root
        group: root
        content: |
          #!/bin/bash
          # 1. Inicia o gerenciador de janelas em segundo plano
          openbox &

          # 2. Desabilita proteção de tela
          xset s off
          xset s noblank
          xset -dpms

          # 3. LOOP INFINITO DE MONITORAMENTO
          while true; do
            # Limpeza de rastro antes de abrir
            rm -rf /home/administrador/.config/google-chrome
            rm -rf /home/administrador/.cache/google-chrome

            # Execução do Chrome (O script fica travado aqui até o Chrome fechar)
            google-chrome-stable \
                --kiosk \
                --incognito \
                --no-first-run \
                --no-default-browser-check \
                --noerrdialogs \
                --disable-infobars \
                --password-store=basic \
                --disable-session-crashed-bubble \
                --check-for-update-interval=31536000 \
                "{{ url_kiosk }}"

            # Se o Chrome fechar (Alt+F4 ou Erro), o script continua aqui
            echo "Navegador fechado. Reiniciando em 1 segundo..."
            sleep 1
          done

    - name: "4. Criar configuração do Openbox para anular o Alt+F4"
      ansible.builtin.file:
        path: "/home/administrador/.config/openbox"
        state: directory
        owner: administrador
        group: administrador
        mode: '0755'

    - name: "5. Blindagem de Teclado no Openbox (rc.xml)"
      ansible.builtin.copy:
        dest: "/home/administrador/.config/openbox/rc.xml"
        owner: administrador
        group: administrador
        content: |
          <?xml version="1.0" encoding="UTF-8"?>
          <openbox_config xmlns="http://openbox.org/3.4/rc">
            <keyboard>
              <keybind key="A-F4"><action name="Execute"><command>true</command></action></keybind>
              <keybind key="A-Tab"><action name="Execute"><command>true</command></action></keybind>
              <keybind key="C-t"><action name="Execute"><command>true</command></action></keybind>
              <keybind key="C-n"><action name="Execute"><command>true</command></action></keybind>
              <keybind key="C-S-n"><action name="Execute"><command>true</command></action></keybind>
            </keyboard>
          </openbox_config>

    - name: "6. Definir a Sessão de Kiosk como Padrão do Sistema"
      ansible.builtin.copy:
        dest: "/usr/share/xsessions/kiosk.desktop"
        content: |
          [Desktop Entry]
          Name=Kiosk
          Comment=Sessão de Kiosk EBEG
          Exec=/usr/local/bin/kiosk.sh
          Type=Application

    - name: "7. Configurar Autologin Direto para o Usuário Administrador"
      ansible.builtin.copy:
        dest: "/etc/lightdm/lightdm.conf"
        content: |
          [Seat:*]
          autologin-guest=false
          autologin-user=administrador
          autologin-user-timeout=0
          user-session=kiosk

    - name: "8. Bloqueio de Teclas de Sistema (Nível Hardware/X11)"
      ansible.builtin.copy:
        dest: "/etc/X11/xorg.conf.d/99-disable-keys.conf"
        content: |
          Section "ServerFlags"
              Option "DontVTSwitch" "true"
              Option "DontZap" "true"
          EndSection

    - name: "9. Reiniciar Máquina para Validar Blindagem"
      ansible.builtin.reboot: