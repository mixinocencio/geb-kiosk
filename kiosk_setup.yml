---
- name: "Setup Kiosk Blindagem Total - Operação Zero Trust EBEG"
  hosts: quiosques_gptw
  become: yes

  tasks:
    - name: "1. Instalar infraestrutura de Kiosk"
      ansible.builtin.apt:
        name: [openbox, lightdm, xbindkeys, xdotool, dbus-x11, lxterminal, wget]
        state: present
        update_cache: yes

    - name: "2. Criar Diretórios de Política do Chrome"
      ansible.builtin.file:
        path: /etc/opt/chrome/policies/managed
        state: directory
        mode: '0755'

    - name: "3. Política Enterprise: ZERO TRUST (Lista Branca Rigorosa)"
      ansible.builtin.copy:
        dest: /etc/opt/chrome/policies/managed/policy.json
        content: |
          {
            "PasswordManagerEnabled": false,
            "DeveloperToolsDisabled": true,
            "ContextMenuEnabled": false,
            "ShowHomeButton": false,
            "BookmarkBarEnabled": false,
            "EditBookmarksEnabled": false,
            "AllowFileSelectionDialogs": false,
            "URLBlocklist": ["*"],
            "URLAllowlist": [
              "{{ url_kiosk }}*",
              "*ebegembalagens.com.br*",
              "*emprising.com*",
              "*greatplacetowork.com*",
              "*gptw.com*"
            ],
            "FullscreenAllowed": true
          }

    - name: "4. Openbox: Identificação Inteligente via Motor X11"
      ansible.builtin.copy:
        dest: "/home/administrador/.config/openbox/rc.xml"
        owner: administrador
        group: administrador
        content: |
          <?xml version="1.0" encoding="UTF-8"?>
          <openbox_config xmlns="http://openbox.org/3.4/rc">
            <applications>
              <application name="app-*">
                <decor>no</decor>
                <fullscreen>yes</fullscreen>
              </application>

              <application name="google-chrome">
                <decor>yes</decor>
                <position force="yes"><x>center</x><y>center</y></position>
                <size><width>90%</width><height>90%</height></size>
              </application>
            </applications>
            <keyboard>
              <keybind key="A-F4"><action name="Close"/></keybind>
              <keybind key="C-A-Insert"><action name="Execute"><command>sudo /usr/bin/chvt 4</command></action></keybind>
              <keybind key="C-A-Home"><action name="Execute"><command>pkill -9 chrome && pkill -9 openbox</command></action></keybind>
            </keyboard>
          </openbox_config>

    - name: "5. Mordaça de Teclado (Bloqueio de Abas e Foco)"
      ansible.builtin.copy:
        dest: /home/administrador/.xbindkeysrc
        owner: administrador
        group: administrador
        content: |
          # Impede de focar na barra de endereço
          "true"
            Control + l
          "true"
            Alt + d
          # Impede de abrir novas abas ou janelas pelo teclado
          "true"
            Control + t
          "true"
            Control + n
          "true"
            F11
          "true"
            F12
          "sudo /sbin/poweroff"
            End
          "sudo /usr/bin/chvt 4"
            Control + Alt + Insert
          "pkill -9 chrome && pkill -9 openbox"
            Control + Alt + Home

    - name: "6. Script Mestre (kiosk.sh) com Limpeza"
      ansible.builtin.copy:
        dest: /home/administrador/kiosk.sh
        owner: administrador
        mode: '0755'
        content: |
          #!/bin/bash
          openbox --config-file /home/administrador/.config/openbox/rc.xml &
          xbindkeys &
          xset s off -dpms

          while true; do
              rm -rf /home/administrador/.config/google-chrome
              rm -rf /home/administrador/.cache/google-chrome
              
              google-chrome \
                  --app="{{ url_kiosk }}" \
                  --incognito \
                  --no-first-run \
                  --disable-translate \
                  --disable-features=Translate,PrivacySandboxSettings4 \
                  --password-store=basic
              sleep 2
          done

    - name: "7. Garantir permissões e Reboot"
      ansible.builtin.shell: chown -R administrador:administrador /home/administrador/
    
    - name: "8. Reboot Tático"
      ansible.builtin.reboot: