---
- name: "Setup Kiosk Blindagem Total - Operação EBEG (Versão Final Consolidada)"
  hosts: all
  become: yes

  vars:
    target_user: "{{ kiosk_user | default('administrador') }}"

  tasks:
    - name: "0. Garantir criação do usuário do Quiosque"
      ansible.builtin.user:
        name: "{{ target_user }}"
        password: "{{ kiosk_password | default('administrador') | password_hash('sha512') }}"
        shell: /bin/bash
        create_home: yes
        state: present

    - name: "1. Instalar infraestrutura de base e utilitários"
      ansible.builtin.apt:
        name: [openbox, lightdm, xbindkeys, xdotool, dbus-x11, lxterminal, wget]
        state: present
        update_cache: yes

    - name: "1.1 Instalar suporte a impressoras (CUPS e drivers)"
      ansible.builtin.apt:
        name: [cups, cups-client, cups-bsd, printer-driver-all]
        state: present
      when: install_printers | default(false) | bool

    - name: "2. Verificar se o Google Chrome já está instalado"
      ansible.builtin.command: dpkg -s google-chrome-stable
      register: chrome_check
      ignore_errors: yes
      changed_when: false

    - name: "3. Instalação do Google Chrome (Idempotente)"
      block:
        - name: "Baixar pacote .deb do Chrome"
          ansible.builtin.get_url:
            url: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            dest: /tmp/google-chrome-stable_current_amd64.deb
            mode: '0644'
        - name: "Instalar Chrome via APT"
          ansible.builtin.apt:
            deb: /tmp/google-chrome-stable_current_amd64.deb
            state: present
        - name: "Remover instalador temporário"
          ansible.builtin.file:
            path: /tmp/google-chrome-stable_current_amd64.deb
            state: absent
      when: chrome_check.rc != 0

    - name: "4. Garantir diretórios de política do Chrome"
      ansible.builtin.file:
        path: /etc/opt/chrome/policies/managed
        state: directory
        mode: '0755'
        recurse: yes

    - name: "5. Aplicar Política Enterprise (Dinâmica e Anti-Login Google)"
      ansible.builtin.copy:
        dest: /etc/opt/chrome/policies/managed/policy.json
        content: |
          {
            "PasswordManagerEnabled": {{ 'true' if persistent_session | default(false) else 'false' }},
            "SyncDisabled": true,
            "SigninAllowed": false,
            "DeveloperToolsDisabled": true,
            "ContextMenuEnabled": {{ 'false' if desktop_session | default('kiosk') == 'kiosk' else 'true' }},
            "ShowHomeButton": {{ 'false' if desktop_session | default('kiosk') == 'kiosk' else 'true' }},
            "BookmarkBarEnabled": {{ 'false' if desktop_session | default('kiosk') == 'kiosk' else 'true' }},
            "EditBookmarksEnabled": {{ 'false' if desktop_session | default('kiosk') == 'kiosk' else 'true' }},
            "AllowFileSelectionDialogs": {{ 'true' if allow_file_selection | default(false) else 'false' }},
            "TranslateEnabled": false,
            "FullscreenAllowed": true,
            "RestoreOnStartup": 4,
            "RestoreOnStartupURLs": ["{{ url_kiosk }}"]
          }

    - name: "6. Configurar permissões de Sudo"
      ansible.builtin.copy:
        dest: /etc/sudoers.d/kiosk-admin
        content: "{{ target_user }} ALL=(ALL) NOPASSWD: /sbin/poweroff, /usr/sbin/poweroff, /bin/chvt, /usr/bin/chvt, /bin/systemctl"
        mode: '0440'

    - name: "7. Configurar Autologin e Sessão LightDM"
      ansible.builtin.copy:
        dest: /etc/lightdm/lightdm.conf.d/99-kiosk-autologin.conf
        content: "[Seat:*]\nautologin-user={{ target_user }}\nautologin-session={{ desktop_session | default('kiosk') }}"

    - name: "8. Garantir estrutura de pastas do Openbox (Correção de Erro)"
      ansible.builtin.file:
        path: "/home/{{ target_user }}/.config/openbox"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0755'
        recurse: yes
      when: desktop_session | default('kiosk') == 'kiosk'

    - name: "9. Configurar Openbox (rc.xml)"
      ansible.builtin.copy:
        dest: "/home/{{ target_user }}/.config/openbox/rc.xml"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        content: |
          <?xml version="1.0" encoding="UTF-8"?>
          <openbox_config xmlns="http://openbox.org/3.4/rc">
            <applications>
              <application name="app-*">
                <decor>no</decor>
                <fullscreen>yes</fullscreen>
              </application>
              <application name="google-chrome">
                <decor>yes</decor>
                <position force="yes"><x>center</x><y>center</y></position>
                <size><width>95%</width><height>95%</height></size>
              </application>
            </applications>
            <keyboard>
              <keybind key="Home"><action name="Execute"><command>pkill -9 chrome && pkill -9 openbox</command></action></keybind>
              <keybind key="A-F4"><action name="Close"/></keybind>
              <keybind key="C-A-Insert"><action name="Execute"><command>sudo /usr/bin/chvt 4</command></action></keybind>
            </keyboard>
          </openbox_config>
      when: desktop_session | default('kiosk') == 'kiosk'

    - name: "10. Bloqueio de Teclado (xbindkeys)"
      ansible.builtin.copy:
        dest: "/home/{{ target_user }}/.xbindkeysrc"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        content: |
          "pkill -9 chrome && pkill -9 openbox"
            Home
          "true"
            Control + l
          "true"
            Alt + d
          "true"
            Control + t
          "true"
            Control + n
          "true"
            F11
          "true"
            F12
          "sudo /sbin/poweroff"
            End
          "sudo /usr/bin/chvt 4"
            Control + Alt + Insert
      when: desktop_session | default('kiosk') == 'kiosk'

    - name: "11. Script de Inicialização Dinâmico (kiosk.sh)"
      ansible.builtin.copy:
        dest: "/home/{{ target_user }}/kiosk.sh"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0755'
        content: |
          #!/bin/bash
          openbox --config-file /home/{{ target_user }}/.config/openbox/rc.xml &
          xbindkeys &
          xset s off -dpms
          while true; do
              # Limpeza condicional baseada na variável persistent_session do hosts.ini
              {% if not persistent_session | default(false) %}
              rm -rf /home/{{ target_user }}/.config/google-chrome
              {% endif %}
              
              google-chrome \
                  --app="{{ url_kiosk }}" \
                  {{ '--incognito' if not persistent_session | default(false) else '' }} \
                  --no-first-run \
                  --password-store=basic
              sleep 2
          done
      when: desktop_session | default('kiosk') == 'kiosk'

    - name: "12. Criar Ficheiro de Sessão Desktop"
      ansible.builtin.copy:
        dest: /usr/share/xsessions/kiosk.desktop
        content: "[Desktop Entry]\nName=Kiosk Mode\nExec=/home/{{ target_user }}/kiosk.sh\nType=Application"
      when: desktop_session | default('kiosk') == 'kiosk'

    - name: "13. Hardening do Desktop (Remover jogos e aplicativos improdutivos)"
      ansible.builtin.apt:
        name:
          - aisleriot
          - gnome-mahjongg
          - gnome-mines
          - gnome-sudoku
          - hexchat
          - pidgin
          - thunderbird
          - transmission-gtk
          - transmission-common
          - hypnotix
          - drawing
        state: absent
        purge: yes
      when: desktop_hardening | default(false) | bool

    - name: "14. Garantir Permissões e Aplicar Reboot"
      ansible.builtin.shell: chown -R {{ target_user }}:{{ target_user }} /home/{{ target_user }}/
      notify: "Reiniciar Sistema"

  handlers:
    - name: "Reiniciar Sistema"
      ansible.builtin.reboot: