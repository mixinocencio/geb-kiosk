---
- name: "Setup Kiosk Blindado - Versão Final com Atalhos Customizados"
  hosts: quiosques
  become: yes

  tasks:
    - name: "1. Instalar infraestrutura de Kiosk e pacotes de controle"
      ansible.builtin.apt:
        name:
          - openbox
          - lightdm
          - xbindkeys
          - xdotool
          - dbus-x11
          - lxterminal
        state: present
        update_cache: yes

    - name: "2. Configurar permissão de Sudo sem senha (Poweroff e Terminal)"
      ansible.builtin.copy:
        dest: /etc/sudoers.d/kiosk-admin
        content: |
          administrador ALL=(ALL) NOPASSWD: /sbin/poweroff
          administrador ALL=(ALL) NOPASSWD: /bin/chvt
        mode: '0440'

    - name: "3. Forçar sessão Kiosk no LightDM"
      ansible.builtin.copy:
        dest: /etc/lightdm/lightdm.conf.d/99-kiosk-autologin.conf
        content: |
          [Seat:*]
          autologin-user=administrador
          autologin-session=kiosk
          user-session=kiosk

    - name: "4. Configurar xbindkeys (Ninja Mode + Poweroff + Backdoor + Emergency)"
      ansible.builtin.copy:
        dest: /home/administrador/.xbindkeysrc
        owner: administrador
        group: administrador
        content: |
          # MANOBRA NINJA: Alt+F4 mata o processo e o loop reinicia limpo
          "pkill -9 chrome"
            alt + f4

          # DESLIGAMENTO TOTAL: Tecla End desliga o hardware
          "sudo /sbin/poweroff"
            End

          # ADMIN BACKDOOR: Ctrl+Alt+Insert cai no terminal TTY4
          "sudo /bin/chvt 4"
            control+alt + Insert

          # ATALHO DE EMERGÊNCIA: Reinicia navegador e limpa cache
          "pkill -9 chrome && pkill -9 openbox"
            control+alt + home

          "true"
            control + w

    - name: "5. Criar Script Mestre (kiosk.sh) com Auto-Limpeza"
      ansible.builtin.copy:
        dest: /home/administrador/kiosk.sh
        owner: administrador
        group: administrador
        mode: '0755'
        content: |
          #!/bin/bash
          openbox &
          xbindkeys &
          xset s off
          xset s noblank
          xset -dpms

          while true; do
              # Limpeza de dados para garantir amnésia de sessão
              rm -rf /home/administrador/.config/google-chrome
              rm -rf /home/administrador/.cache/google-chrome
              
              google-chrome \
                  --kiosk \
                  --incognito \
                  --no-first-run \
                  --disable-infobars \
                  --disable-session-crashed-bubble \
                  --password-store=basic \
                  "{{ url_kiosk }}"
              sleep 2
          done

    - name: "6. Criar a definição da Sessão (kiosk.desktop)"
      ansible.builtin.copy:
        dest: /usr/share/xsessions/kiosk.desktop
        content: |
          [Desktop Entry]
          Name=Kiosk Mode
          Exec=/home/administrador/kiosk.sh
          Type=Application

    - name: "7. Ajustar Terminais (Liberar VTSwitch para Suporte Técnico)"
      ansible.builtin.copy:
        dest: /etc/X11/xorg.conf.d/99-enable-keys.conf
        content: |
          Section "ServerFlags"
              Option "DontVTSwitch" "false"
              Option "DontZap" "true"
          EndSection

    - name: "8. Garantir permissões na Home do Administrador"
      ansible.builtin.shell: chown -R administrador:administrador /home/administrador/

    - name: "9. Reboot Tático"
      ansible.builtin.reboot: