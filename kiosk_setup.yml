---
- name: "Setup Kiosk Blindado - Operação Tolerância Zero"
  hosts: quiosques
  become: yes

  tasks:
    - name: "1. Garantir pacotes de controle e gerenciamento de janela"
      ansible.builtin.apt:
        name:
          - openbox
          - xdotool
          - dbus-x11
          - x11-xserver-utils
        state: present
        update_cache: yes

    - name: "2. Limpeza total de configurações conflitantes"
      ansible.builtin.shell: |
        rm -rf /etc/lightdm/lightdm.conf.d/*
        rm -rf /home/administrador/.config/autostart/*
        chmod -x /usr/bin/gnome-keyring-daemon || true
      ignore_errors: yes

    - name: "3. Criar diretório de configuração do Openbox"
      ansible.builtin.file:
        path: "/home/administrador/.config/openbox"
        state: directory
        owner: administrador
        group: administrador
        mode: '0755'

    - name: "4. Configurar as travas de teclado (Morte ao Alt+F4)"
      ansible.builtin.copy:
        dest: "/home/administrador/.config/openbox/rc.xml"
        owner: administrador
        group: administrador
        content: |
          <?xml version="1.0" encoding="UTF-8"?>
          <openbox_config xmlns="http://openbox.org/3.4/rc">
            <keyboard>
              <chainQuitKey>C-g</chainQuitKey>
              <keybind key="A-F4"><action name="Execute"><command>true</command></action></keybind>
              <keybind key="A-Tab"><action name="Execute"><command>true</command></action></keybind>
              <keybind key="C-t"><action name="Execute"><command>true</command></action></keybind>
              <keybind key="C-n"><action name="Execute"><command>true</command></action></keybind>
              <keybind key="C-S-n"><action name="Execute"><command>true</command></action></keybind>
            </keyboard>
          </openbox_config>

    - name: "5. Criar o Script Mestre com Log de Auditoria"
      ansible.builtin.copy:
        dest: "/usr/local/bin/kiosk.sh"
        mode: '0755'
        owner: root
        group: root
        content: |
          #!/bin/bash
          # Redireciona erros para um log para análise do coordenador
          exec 2> /home/administrador/kiosk_error.log

          # Garante que o Openbox suba com as travas do rc.xml
          openbox --config-file /home/administrador/.config/openbox/rc.xml &

          # Desabilita gerenciamento de energia
          xset s off
          xset s noblank
          xset -dpms

          while true; do
            # Purga de dados para garantir amnésia de sessão
            rm -rf /home/administrador/.config/google-chrome
            rm -rf /home/administrador/.cache/google-chrome

            # Inicialização do Chrome em modo estéril
            google-chrome-stable \
                --kiosk \
                --incognito \
                --no-first-run \
                --no-default-browser-check \
                --noerrdialogs \
                --disable-infobars \
                --password-store=basic \
                --disable-session-crashed-bubble \
                "{{ url_kiosk }}"

            # Se o processo cair, aguarda 1s e reinicia o ciclo
            sleep 1
          done

    - name: "6. Configurar a Sessão de Kiosk no Sistema"
      ansible.builtin.copy:
        dest: "/usr/share/xsessions/kiosk.desktop"
        content: |
          [Desktop Entry]
          Name=Kiosk
          Comment=Sessao Blindada EBEG
          Exec=/usr/local/bin/kiosk.sh
          Type=Application

    - name: "7. Forçar Autologin e Sessão Única (LightDM)"
      ansible.builtin.copy:
        dest: "/etc/lightdm/lightdm.conf"
        content: |
          [Seat:*]
          autologin-guest=false
          autologin-user=administrador
          autologin-user-timeout=0
          user-session=kiosk

    - name: "8. Bloqueio de Teclas de Hardware (X11)"
      ansible.builtin.copy:
        dest: "/etc/X11/xorg.conf.d/99-disable-keys.conf"
        content: |
          Section "ServerFlags"
              Option "DontVTSwitch" "true"
              Option "DontZap" "true"
          EndSection

    - name: "9. Ajustar permissões e Reiniciar"
      ansible.builtin.shell: "chown -R administrador:administrador /home/administrador/"
      
    - name: "10. Reboot Tático"
      ansible.builtin.reboot: