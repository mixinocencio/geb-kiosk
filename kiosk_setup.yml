---
- name: "Setup Kiosk Blindagem Total - Operação Zero Trust (Versão Definitiva)"
  hosts: quiosques_gptw
  become: yes

  tasks:
    - name: "1. Instalar infraestrutura de Kiosk e pacotes de controle"
      ansible.builtin.apt:
        name: 
          - openbox
          - lightdm
          - xbindkeys
          - xdotool
          - dbus-x11
          - lxterminal
          - wget
        state: present
        update_cache: yes

    - name: "2. Download e Instalação do Google Chrome (Redundância)"
      block:
        - name: "Baixar pacote .deb do Chrome"
          ansible.builtin.get_url:
            url: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            dest: /tmp/google-chrome-stable_current_amd64.deb
            mode: '0644'

        - name: "Instalar Chrome via APT"
          ansible.builtin.apt:
            deb: /tmp/google-chrome-stable_current_amd64.deb
            state: present
          ignore_errors: yes

        - name: "Corrigir dependências quebradas"
          ansible.builtin.shell: apt-get install -f -y
          changed_when: false

    - name: "3. Criar Diretórios de Política do Chrome"
      ansible.builtin.file:
        path: /etc/opt/chrome/policies/managed
        state: directory
        mode: '0755'

    - name: "4. Política Enterprise: ZERO TRUST Absoluto (Anti-Popups, Fuga e Tradução)"
      ansible.builtin.copy:
        dest: /etc/opt/chrome/policies/managed/policy.json
        content: |
          {
            "PasswordManagerEnabled": false,
            "DeveloperToolsDisabled": true,
            "ContextMenuEnabled": false,
            "ShowHomeButton": false,
            "BookmarkBarEnabled": false,
            "EditBookmarksEnabled": false,
            "AllowFileSelectionDialogs": false,
            "TranslateEnabled": false,
            "URLBlocklist": ["*"],
            "URLAllowlist": [
              "{{ url_kiosk }}*",
              "*ebegembalagens.com.br*",
              "*emprising.com*",
              "*greatplacetowork.com*",
              "*gptw.com*"
            ],
            "FullscreenAllowed": true
          }

    - name: "5. Configurar permissão de Sudo sem senha"
      ansible.builtin.copy:
        dest: /etc/sudoers.d/kiosk-admin
        content: |
          administrador ALL=(ALL) NOPASSWD: /sbin/poweroff, /usr/sbin/poweroff, /bin/chvt, /usr/bin/chvt, /bin/systemctl
        mode: '0440'

    - name: "6. Forçar sessão Kiosk no LightDM"
      ansible.builtin.copy:
        dest: /etc/lightdm/lightdm.conf.d/99-kiosk-autologin.conf
        content: |
          [Seat:*]
          autologin-user=administrador
          autologin-session=kiosk
          user-session=kiosk

    - name: "7. Preparar Diretório do Openbox"
      ansible.builtin.file:
        path: "/home/administrador/.config/openbox"
        state: directory
        owner: administrador
        group: administrador
        mode: '0755'

    - name: "8. Openbox: Regras de Janela Inteligentes e Controle de Interface"
      ansible.builtin.copy:
        dest: "/home/administrador/.config/openbox/rc.xml"
        owner: administrador
        group: administrador
        content: |
          <?xml version="1.0" encoding="UTF-8"?>
          <openbox_config xmlns="http://openbox.org/3.4/rc">
            <applications>
              <application name="app-*">
                <decor>no</decor>
                <fullscreen>yes</fullscreen>
              </application>

              <application name="google-chrome">
                <decor>yes</decor>
                <position force="yes"><x>center</x><y>center</y></position>
                <size><width>90%</width><height>90%</height></size>
              </application>
            </applications>
            <keyboard>
              <keybind key="A-F4"><action name="Close"/></keybind>
              <keybind key="C-A-Insert"><action name="Execute"><command>sudo /usr/bin/chvt 4</command></action></keybind>
              <keybind key="C-A-Home"><action name="Execute"><command>pkill -9 chrome && pkill -9 openbox</command></action></keybind>
            </keyboard>
          </openbox_config>

    - name: "9. Mordaça de Teclado (Bloqueio Físico via xbindkeys)"
      ansible.builtin.copy:
        dest: /home/administrador/.xbindkeysrc
        owner: administrador
        group: administrador
        content: |
          # Impede de focar na barra de endereço
          "true"
            Control + l
          "true"
            Alt + d
          # Impede de abrir novas abas ou janelas
          "true"
            Control + t
          "true"
            Control + n
          "true"
            F11
          "true"
            F12
          # Desligamento por hardware
          "sudo /sbin/poweroff"
            End
          # Admin Backdoors (Redundância do Openbox)
          "sudo /usr/bin/chvt 4"
            Control + Alt + Insert
          "pkill -9 chrome && pkill -9 openbox"
            Control + Alt + Home

    - name: "10. Script Mestre (kiosk.sh) com Loop Definitivo"
      ansible.builtin.copy:
        dest: /home/administrador/kiosk.sh
        owner: administrador
        group: administrador
        mode: '0755'
        content: |
          #!/bin/bash
          openbox --config-file /home/administrador/.config/openbox/rc.xml &
          xbindkeys &
          xset s off
          xset s noblank
          xset -dpms

          while true; do
              rm -rf /home/administrador/.config/google-chrome
              rm -rf /home/administrador/.cache/google-chrome
              
              google-chrome \
                  --app="{{ url_kiosk }}" \
                  --incognito \
                  --no-first-run \
                  --disable-translate \
                  --disable-features=Translate,PrivacySandboxSettings4 \
                  --password-store=basic
              sleep 2
          done

    - name: "11. Criar a definição da Sessão Kiosk"
      ansible.builtin.copy:
        dest: /usr/share/xsessions/kiosk.desktop
        content: |
          [Desktop Entry]
          Name=Kiosk Mode
          Exec=/home/administrador/kiosk.sh
          Type=Application

    - name: "12. Ajustar Terminais (Liberar VTSwitch)"
      ansible.builtin.copy:
        dest: /etc/X11/xorg.conf.d/99-enable-keys.conf
        content: |
          Section "ServerFlags"
              Option "DontVTSwitch" "false"
              Option "DontZap" "true"
          EndSection

    - name: "13. Garantir Permissões"
      ansible.builtin.shell: chown -R administrador:administrador /home/administrador/

    - name: "14. Reboot Tático"
      ansible.builtin.reboot: