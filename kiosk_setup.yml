---
- name: "Setup Kiosk Blindado - Fusão com Script Original"
  hosts: quiosques
  become: yes

  tasks:
    - name: "1. Instalar pacotes essenciais (Incluindo xbindkeys)"
      ansible.builtin.apt:
        name:
          - openbox
          - lightdm
          - xbindkeys
          - xdotool
        state: present
        update_cache: yes

    - name: "2. Preparar diretório de sobrescrita do LightDM"
      ansible.builtin.file:
        path: /etc/lightdm/lightdm.conf.d
        state: directory

    - name: "3. Forçar sessão Kiosk (Método Oficial Linux Mint)"
      ansible.builtin.copy:
        dest: /etc/lightdm/lightdm.conf.d/99-kiosk-autologin.conf
        content: |
          [Seat:*]
          autologin-user=administrador
          autologin-session=kiosk
          user-session=kiosk

    - name: "4. Configurar xbindkeys para matar Alt+F4 e Ctrl+W"
      ansible.builtin.copy:
        dest: /home/administrador/.xbindkeysrc
        owner: administrador
        group: administrador
        content: |
          # Ignora Alt+F4
          "true"
            alt + f4
          # Ignora Ctrl+W (Fechar aba)
          "true"
            control + w
          # Ignora Ctrl+T (Nova aba)
          "true"
            control + t
          # Ignora Ctrl+N (Nova janela)
          "true"
            control + n

    - name: "5. Criar Script Mestre (Padrão Original Validado)"
      ansible.builtin.copy:
        dest: /home/administrador/kiosk.sh
        owner: administrador
        group: administrador
        mode: '0755'
        content: |
          #!/bin/bash
          # 1. Inicia o Openbox silenciosamente
          openbox &

          # 2. Inicia o bloqueador de teclas do usuário
          xbindkeys &

          # 3. Desativa proteções de tela
          xset s off
          xset s noblank
          xset -dpms

          # 4. Loop Infinito (Anti-fechamento)
          while true; do
              # Limpa flags de erro do Chrome para evitar a barra "O Chrome não foi fechado corretamente"
              sed -i 's/"exited_cleanly":false/"exited_cleanly":true/' /home/administrador/.config/google-chrome/Default/Preferences 2>/dev/null || true
              sed -i 's/"exit_type":"Crashed"/"exit_type":"Normal"/' /home/administrador/.config/google-chrome/Default/Preferences 2>/dev/null || true

              # Disparo do Navegador
              google-chrome \
                  --kiosk \
                  --incognito \
                  --no-first-run \
                  --disable-translate \
                  --disable-infobars \
                  --disable-suggestions-service \
                  --disable-save-password-bubble \
                  --disable-session-crashed-bubble \
                  --password-store=basic \
                  "{{ url_kiosk }}"

              # Se fechar, aguarda 2s e reabre
              sleep 2
          done

    - name: "6. Criar a Sessão Customizada (kiosk.desktop)"
      ansible.builtin.copy:
        dest: /usr/share/xsessions/kiosk.desktop
        content: |
          [Desktop Entry]
          Name=Kiosk Mode
          Comment=Sessão Kiosk com Google Chrome e bloqueio de abas
          Exec=/home/administrador/kiosk.sh
          Type=Application

    - name: "7. Ajustar propriedade de todos os arquivos do administrador"
      ansible.builtin.shell: chown -R administrador:administrador /home/administrador/

    - name: "8. Reboot Tático"
      ansible.builtin.reboot: