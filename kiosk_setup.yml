---
- name: "Setup Kiosk Blindado - Versão Final Completa (Base + Chrome + Atalhos)"
  hosts: quiosques
  become: yes

  tasks:
    - name: "1. Instalar infraestrutura de Kiosk e pacotes de controle"
      ansible.builtin.apt:
        name:
          - openbox
          - lightdm
          - xbindkeys
          - xdotool
          - dbus-x11
          - lxterminal
          - wget
        state: present
        update_cache: yes

    - name: "2. Download e Instalação do Google Chrome (Para máquinas zeradas)"
      block:
        - name: "Baixar pacote .deb do Chrome"
          ansible.builtin.get_url:
            url: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            dest: /tmp/google-chrome-stable_current_amd64.deb
            mode: '0644'

        - name: "Instalar Chrome via APT"
          ansible.builtin.apt:
            deb: /tmp/google-chrome-stable_current_amd64.deb
            state: present
          ignore_errors: yes

        - name: "Corrigir possíveis dependências quebradas"
          ansible.builtin.shell: apt-get install -f -y
          changed_when: false

    - name: "3. Configurar permissão de Sudo sem senha (Caminhos Corrigidos)"
      ansible.builtin.copy:
        dest: /etc/sudoers.d/kiosk-admin
        content: |
          administrador ALL=(ALL) NOPASSWD: /sbin/poweroff, /usr/sbin/poweroff, /bin/chvt, /usr/bin/chvt, /bin/systemctl
        mode: '0440'

    - name: "4. Forçar sessão Kiosk no LightDM"
      ansible.builtin.copy:
        dest: /etc/lightdm/lightdm.conf.d/99-kiosk-autologin.conf
        content: |
          [Seat:*]
          autologin-user=administrador
          autologin-session=kiosk
          user-session=kiosk

    - name: "5. Configurar xbindkeys (Sintaxe Rigorosa X11)"
      ansible.builtin.copy:
        dest: /home/administrador/.xbindkeysrc
        owner: administrador
        group: administrador
        content: |
          # MANOBRA NINJA: Alt+F4 mata o processo e o loop reinicia limpo
          "pkill -9 chrome"
            Alt + F4

          # DESLIGAMENTO TOTAL: Tecla End desliga o hardware
          "sudo /sbin/poweroff"
            End

          # ADMIN BACKDOOR: Ctrl+Alt+Insert cai no terminal TTY4
          "sudo /usr/bin/chvt 4"
            Control + Alt + Insert

          # ATALHO DE EMERGÊNCIA: Reinicia navegador e limpa cache
          "pkill -9 chrome && pkill -9 openbox"
            Control + Alt + Home

          # TRAVA DE ABA: Ignora Ctrl+W
          "true"
            Control + w

    - name: "6. Criar Script Mestre (kiosk.sh) com Auto-Limpeza"
      ansible.builtin.copy:
        dest: /home/administrador/kiosk.sh
        owner: administrador
        group: administrador
        mode: '0755'
        content: |
          #!/bin/bash
          openbox &
          xbindkeys &
          xset s off
          xset s noblank
          xset -dpms

          while true; do
              # Limpeza de dados para garantir amnésia de sessão
              rm -rf /home/administrador/.config/google-chrome
              rm -rf /home/administrador/.cache/google-chrome
              
              google-chrome \
                  --kiosk \
                  --incognito \
                  --no-first-run \
                  --disable-infobars \
                  --disable-session-crashed-bubble \
                  --password-store=basic \
                  "{{ url_kiosk }}"
              sleep 2
          done

    - name: "7. Criar a definição da Sessão (kiosk.desktop)"
      ansible.builtin.copy:
        dest: /usr/share/xsessions/kiosk.desktop
        content: |
          [Desktop Entry]
          Name=Kiosk Mode
          Exec=/home/administrador/kiosk.sh
          Type=Application

    - name: "8. Ajustar Terminais (Liberar VTSwitch para Suporte Técnico)"
      ansible.builtin.copy:
        dest: /etc/X11/xorg.conf.d/99-enable-keys.conf
        content: |
          Section "ServerFlags"
              Option "DontVTSwitch" "false"
              Option "DontZap" "true"
          EndSection

    - name: "9. Garantir permissões na Home do Administrador"
      ansible.builtin.shell: chown -R administrador:administrador /home/administrador/

    - name: "10. Reboot Tático"
      ansible.builtin.reboot: