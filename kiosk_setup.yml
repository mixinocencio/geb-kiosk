---
- name: Setup Militar de Quiosques (Fábrica, RH e GPTW)
  hosts: quiosques
  become: yes

  tasks:
    - name: 1. Atualizar repositórios APT
      ansible.builtin.apt:
        update_cache: yes

    - name: 2. Instalar dependências básicas
      ansible.builtin.apt:
        name:
          - wget
          - gnupg2
          - ca-certificates
        state: present

    - name: 3. Baixar instalador do Google Chrome
      ansible.builtin.get_url:
        url: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        dest: /tmp/google-chrome-stable_current_amd64.deb
        mode: '0644'

    - name: 4. Instalar Google Chrome via .deb
      ansible.builtin.apt:
        deb: /tmp/google-chrome-stable_current_amd64.deb
        state: present
      ignore_errors: yes

    - name: 5. Corrigir dependências quebradas (Fix Broken)
      ansible.builtin.command: apt-get install -f -y
      register: fix_result
      changed_when: "'0 atualizados, 0 novos instalados' not in fix_result.stdout and '0 upgraded, 0 newly installed' not in fix_result.stdout"

    - name: 6. Configurar Autologin no LightDM
      ansible.builtin.copy:
        dest: /etc/lightdm/lightdm.conf
        content: |
          [Seat:*]
          autologin-guest=false
          autologin-user=administrador
          autologin-user-timeout=0
          user-session=cinnamon
        mode: '0644'

    - name: 7. Garantir diretório de autostart para o usuário administrador
      ansible.builtin.file:
        path: /home/administrador/.config/autostart
        state: directory
        owner: administrador
        group: administrador
        mode: '0755'

    - name: 8. Criar atalho do Kiosk (Chrome em tela cheia)
      ansible.builtin.copy:
        dest: /home/administrador/.config/autostart/kiosk.desktop
        content: |
          [Desktop Entry]
          Type=Application
          Exec=google-chrome --no-first-run --kiosk {{ url_kiosk }}
          Hidden=false
          NoDisplay=false
          X-GNOME-Autostart-enabled=true
          Name=Kiosk
        owner: administrador
        group: administrador
        mode: '0644'

    - name: 9. Reiniciar LightDM para aplicar (A tela vai piscar)
      ansible.builtin.service:
        name: lightdm
        state: restarted
      async: 1
      poll: 0
      ignore_unreachable: yes