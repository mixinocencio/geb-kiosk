[quiosques_fabrica:vars]
url_kiosk="https://ebegembalagens.sharepoint.com/sites/BasedeConhecimentoSAP"
# Ativa a gravação de senhas e sessão
persistent_session=true

[quiosques_rh:vars]
url_kiosk="https://www.grupoebeg.com.br/Kiosk/"
# Mantém a limpeza total de dados
persistent_session=false

[quiosques_gptw:vars]
url_kiosk="https://grupoebeg.com.br/gptw/index.html"
# Mantém a limpeza total de dados
persistent_session=false

[quiosques_portaria:vars]
url_kiosk="https://www.office.com"
# Mantém login no Office 365 e cookies de sessão
persistent_session=true
# Define o usuário do SO
kiosk_user="portaria"
# Senha de acesso e sudo NOPASSWD
kiosk_password="Jdia@5987"
# Permite abrir e salvar planilhas e anexos no navegador
allow_file_selection=true
# Instala CUPS e suporte a impressão
install_printers=true
# Modo de sessão do LightDM: "xfce" ativa o desktop normal (barras, menus, explorer); "kiosk" ativa Openbox blindado
desktop_session="xfce"
# Ativa o hardening do desktop para remover jogos e aplicativos improdutivos
desktop_hardening=true
# Habilita o servidor de acesso remoto x11vnc na porta 5900
enable_vnc=true
# Senha de autenticação para acesso remoto via VNC
vnc_password="Jdia@5987"
# Papel de parede corporativo e blindagem contra alteração
custom_wallpaper="files/ebeg_wallpaper.png"
lock_wallpaper=true
# Desabilitar autologin: o usuário deve digitar a senha para acessar e desbloquear a máquina
autologin_enabled=false